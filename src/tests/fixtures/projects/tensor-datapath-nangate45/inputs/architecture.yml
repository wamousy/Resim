resources:
  technology: Nangate45 logic reference + exploratory DRAM/TSV assumptions
  technology_provenance: Shared Nangate45 tech/cell LEF; hashes in 
    _references/sources/manifest.json
  metals:
  - name: metal1
    direction: HORIZONTAL
    pitch_um: 0.14
    width_um: 0.07
    availability:
  - name: metal2
    direction: VERTICAL
    pitch_um: 0.19
    width_um: 0.07
    availability:
  - name: metal3
    direction: HORIZONTAL
    pitch_um: 0.14
    width_um: 0.07
    availability:
  - name: metal4
    direction: VERTICAL
    pitch_um: 0.28
    width_um: 0.14
    availability:
  - name: metal5
    direction: HORIZONTAL
    pitch_um: 0.28
    width_um: 0.14
    availability:
  - name: metal6
    direction: VERTICAL
    pitch_um: 0.28
    width_um: 0.14
    availability:
  - name: metal7
    direction: HORIZONTAL
    pitch_um: 0.8
    width_um: 0.4
    availability:
  - name: metal8
    direction: VERTICAL
    pitch_um: 0.8
    width_um: 0.4
    availability:
  - name: metal9
    direction: HORIZONTAL
    pitch_um: 1.6
    width_um: 0.8
    availability:
  - name: metal10
    direction: VERTICAL
    pitch_um: 1.6
    width_um: 0.8
    availability:
  routing_availability: 0.4
  tsv:
    diameter_um: 5.0
    pitch_um: 10.0
    keepout_um: 2.5
    bond_pitch_um: 10.0
    max_current_mA: 20.0
    provenance: Exploratory aggregate TSV-band model; not Nangate45 LEF data.
  delay_model:
    planar_ps_per_um: 0.02
    tier_ps: 20.0
    provenance: Illustrative effective wire/TSV delay coefficients for layout 
      comparison, NOT extracted from Nangate45; replace with characterized 
      RC/repeater/interface data.
    calibrated: false
  notes:
  - The full chip is a 4x4 array of 16 identical multilayer tensor tiles.
  - Each tile contains three logic tiers and eight 1-GiB DRAM tiers; total 
    modeled DRAM capacity is 128 GiB.
  - horizontal_cores_x3 and vertical_cores_x3 are not local modules. They are 
    the three peer tiles in the same row and column.
  - Each tile HLINK has directed 2K links to the other three HLINKs in its row; 
    each VLINK has directed 4K links to the other three VLINKs in its column.
  - The 4x4 array is spatially unfolded on every physical tier. A tile slot is 
    18x10 mm, set by the DRAM footprint envelope.
  - Every tile owns one independent 3100x2300-um TSV region on every adjacent 
    tier interface, giving 16 TSV channels per interface.
  - The explicit load paths are DRAM to DRAM buffer to ODMA0 to SSRAM, and DRAM 
    to DRAM buffer to ODMA0 to VLINK to WSRAM.
  - K is interpreted as 1024 bits and each annotated bus is budgeted as fully 
    parallel physical wires.
  - Peer links are explicit point-to-point copies. Electrical multicast, 
    serialization or a shared bus requires a different physical wire budget.
  - Nangate45 supplies logic-cell and routing geometry only; SRAM, DRAM and TSV 
    figures are exploratory assumptions.
  - Power is unknown, and this is architecture-level estimation rather than 
    timing, thermal or detailed-routing signoff.
  - Logic modules may move within their own core placement_window and migrate 
    only among three logic tiers; DRAM stays fixed.
  - 'Supply ports are core-owned budgets: external entry on logic0, stack-fed entry
    on upper tiers. Capacities and power are unknown, so feasibility is incomplete.'
  - The delay model is an uncalibrated linear comparison proxy, not STA or 
    end-to-end algorithm latency.
  - SSRAM -> ODMA0 follows the source diagram; reverse ODMA0 -> SSRAM is 
    retained as the previous project loading-path assumption.
  - Dataflow revision groups WSRAM/ASRAM/CSRAM/TENSOR and VLINK/HLINK on logic1,
    SSRAM/RVG/transform on logic0; ODMA0/ODMA1/DRAM buffer on logic2.
