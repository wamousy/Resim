  notes:
  - A 2x2 um supply_access placement blockage near the external supply port is 
    an exploratory reservation, not a PDK rule or IO macro.
  - Area is an uncalibrated cell-count estimate, not synthesis or 
    place-and-route output.
  - Power is unknown (null); incomplete assessment is intentional.
  - Single-die block-level model; no SRAM macros and no TSV.
  - 70x60 um die, 50 um thickness, 1.1 V and 10 mA supply capacity are 
    exploratory assumptions, not measured design values.
  - routing_availability=0.3 and target utilization=0.55 are assumed budgets.
  - Internal wires use explicit RTL widths. bandwidth_GBps=0 disables 
    throughput-derived demand; lane_rate_Gbps=1 is a required placeholder, not a
    timing claim.
  - Shared fanout is represented as independent point-to-point links; 
    clock/reset trees, package IO and external ready/valid links are excluded.
  - No GCD execution latency, frequency, throughput or functional simulation is 
    performed.
