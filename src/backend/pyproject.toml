[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resim"
version = "0.12.0"
description = "Architecture-level chip resource evaluation and floorplan exploration"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "numpy==2.5.3",
  "ortools==9.15.6755",
  "pydantic==2.13.5",
  "ruamel.yaml==0.19.1",
  "shapely==2.1.2",
  "uvicorn==0.53.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "pyinstaller==6.22.3"]

[project.scripts]
resim = "resim.__main__:main"

[tool.setuptools]
py-modules = ["resim_search_policy", "resim_policy_stack", "resim_policy_storage", "resim_policy_portable"]

[tool.setuptools.packages.find]
where = ["."]
include = ["resim*"]

[tool.pytest.ini_options]
testpaths = ["../tests/backend"]
pythonpath = ["."]
addopts = "-ra"
